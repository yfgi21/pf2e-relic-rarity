name: Sync Source From Distribution

on:
  push:
    branches: [main]
    paths:
      - "dist/*.zip"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract module source
        shell: bash
        run: |
          ZIP=$(ls -1 dist/pf2e-relic-rarity-v*.zip | sort -V | tail -1)
          rm -rf .sync-module
          mkdir .sync-module
          unzip -q "$ZIP" -d .sync-module
          rsync -a .sync-module/pf2e-relic-rarity/ ./
          rm -rf .sync-module
      - name: Commit synchronized source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md module.json scripts styles lang assets
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync module source from v2.2.0 distribution [skip ci]"
          git push
